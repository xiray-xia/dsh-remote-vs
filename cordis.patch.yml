# dsh-remote-vs bundle patch: inserts the dual-face plugin row into the profile
# roster. The node half (exports ".") runs in the host process (remote store,
# ssh2 pool, /api/dsh-remote routes, agent tools); the browser half (exports
# "./client") registers the remote explorer tab into dsh-better-sidebar.
# P2 adds a private local realm + transparent routers (fs/subprocess/spill)
# and a bash shell for the Remote preset. Stock tool rows are untouched: tools
# resolve the routed root services dynamically.
- insert:
    - id: remote-vs
      name: 'dsh-remote-vs'

    # Preserve the stock local providers in a private realm. The bridge
    # publishes them under non-conflicting names consumed by the routers.
    - id: remote-vs-local-world
      name: cordis:group
      group: true
      isolate:
        fileReferences: true
        fs: true
        subprocess: true
        spillStore: true
      config:
        - id: local-subprocess
          name: '@deepseek-ai/dsh-subprocess-local'
        - id: local-fs
          name: '@deepseek-ai/dsh-fs-sandbox'
        - id: local-spill
          name: '@deepseek-ai/dsh-spill-local'
        - id: local-refs
          name: '@deepseek-ai/dsh-file-reference-local'
        - id: local-bridge
          name: dsh-remote-vs/p2-bridge
          inject: [fs, subprocess, spillStore]
        # Separate bridge: local-refs injects workingDirectory (downstream of
        # our replaced fs), so it must not gate fs/subprocess/spillStore.
        - id: local-bridge-refs
          name: dsh-remote-vs/p2-bridge-refs
          inject: [fileReferences]

    - id: remote-vs-fs-router
      name: dsh-remote-vs/p2-router-fs
      inject: [localFs, remoteWorlds]

    - id: remote-vs-subprocess-router
      name: dsh-remote-vs/p2-router-subprocess
      inject: [localSubprocess, remoteWorlds]

    - id: remote-vs-spill-router
      name: dsh-remote-vs/p2-router-spill
      inject: [localSpillStore, remoteWorlds]

    - id: remote-vs-file-refs-router
      name: dsh-remote-vs/p2-router-refs
      inject: [localFileReferences, remoteWorlds]

    # Remote agent preset, bound to this bundle's lifecycle.
    # Mirrored from preset-standard @ dsh 0.2.1-alpha.3 with these diffs:
    #   1. persona prefix reframed for remote SSH work (transparent routing);
    #   2. tool-bash moved into an isolated shell group with our routed bash
    #      executor (stock root shell stays pwsh on Windows);
    #   3. tool-pwsh row dropped.
    # Everything else is byte-identical so future diffs against stock stay obvious.
    # alpha.3 note: stock dropped `toolFilter` (subagent children now inherit
    # the parent composition; fork must not select presets) — our mirror drops
    # both blocks with it.
    # alpha.4 note: stock added `tool-plugin-market` (disabled: true in every
    # preset) right after `tool-plugin-manager` — mirrored here for the same
    # reason as above: a row missing from the mirror is a preset that silently
    # loads a different toolset than stock.
    - id: preset-remote
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: remote
        name: Remote
        description: 'Remote SSH development (POSIX): bash toolset, remote conventions, transparent remote execution.'
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model, working with REMOTE SSH hosts (POSIX/Linux)
                and local paths transparently: tools follow the session workspace — remote workspaces execute on
                their SSH host, local paths stay local. Prefer bash and POSIX absolute paths for remote work;
                remote_hosts lists configured hosts when you need explicit cross-world operations. A `remote
                workspace` context block states this session's alias→host→root mapping when remote; trust it.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: remote-shell
            name: cordis:group
            group: true
            isolate:
              shell: true
            config:
              - id: remote-bash-shell
                name: dsh-remote-vs/p2-shell-bash
                inject: [subprocess, remoteWorlds]
                config:
                  timeoutMs: 60000
              - id: tool-bash
                name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: >
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode
                    or switches the session mode. Imperative
                    language to implement changes means plan the implementation, not
                    execute it. A user's conversational agreement — including an
                    answer confirming something you asked — approves nothing and
                    does not end plan mode; fold the confirmed decision into the
                    plan and submit it through exit_plan_mode.


                    Explore first. Use non-mutating reads, searches, static
                    analysis, and checks to ground the plan in the actual
                    repository. Do not edit or write files, change configuration,
                    run formatters or code generation that rewrites tracked files,
                    commit, or otherwise carry out the plan. Prefer existing
                    functions and patterns over new machinery.


                    The tool catalog stays the same across modes for request-cache
                    stability. These plan-mode rules override any later tool
                    description or guidance that suggests using mutation tools;
                    those tools remain listed to keep the tool catalog unchanged. Do
                    not use todo_write to track this planning phase: it tracks
                    implementation after an approved plan, while the plan itself
                    belongs in exit_plan_mode.


                    Resolve discoverable facts by inspection. Use ask_user_question
                    only for user-owned choices or material ambiguity that
                    inspection cannot answer. Do not ask the user where code lives
                    or how current behavior works when you can find out.


                    Make the plan decision-complete: state the goal and success
                    criteria; group implementation changes by subsystem; identify
                    public API, schema, and data-flow changes; cover edge cases,
                    failure modes, tests, acceptance criteria, and explicit
                    assumptions. Keep it concise enough to review but detailed
                    enough that another engineer can implement it without making
                    design decisions.


                    When ready, call exit_plan_mode with the complete plan markdown,
                    starting with a # title. Make exit_plan_mode the only and final
                    tool call in that assistant response: it presents the plan for
                    approval, and implementation begins only in a later step after
                    approval. Do not paste the final plan as a plain reply or ask
                    "should I proceed?" through prose or ask_user_question. If
                    review rejects it, incorporate the feedback and present again.
                    If the review channel is unavailable or aborted, stay in plan
                    mode and ask the user to switch modes manually; do not proceed
                    with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true

# P2 root replacement: stock providers yield to the transparent routers (local
# behavior preserved inside remote-vs-local-world). Tool, shell-dialect and
# preset rows are untouched; rollback = disable this bundle.
- id: subprocess
  disabled: true
- id: fs-sandbox
  disabled: true
- id: spill-local
  disabled: true
- id: file-reference-local
  disabled: true
