overrides:
  # Aligned with what the DSH app itself ships (read from the installed
  # @deepseek-ai/dsh package's dependencies): the plugin is typechecked against
  # these, and the host half runs against the app's copies at runtime. Being
  # behind them is how you get a second copy of the core library in one process.
  '@deepseek-ai/schemastery': '3.18.5'
  '@deepseek-ai/cosmokit': '1.8.6'
  '@deepseek-ai/cordis': '4.0.5'
