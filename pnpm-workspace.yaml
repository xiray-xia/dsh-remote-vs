packages:
  - .

# Our peers are provided by the DSH runtime (the host half is bundled and
# resolves them from the app). Letting pnpm auto-install them pulled the
# leftover 0.2.0-rc.2 generation of @deepseek-ai/dsh-* into this tree, and those
# packages demand the OLD core versions (`^3.18.4` schemastery, `~4.0.4` cordis).
# Because a prerelease cannot satisfy a release peer range, pnpm then installed a
# SECOND copy next to the one the alpha.4 packages want — two type identities for
# the same library, which is what blew TypeScript's heap (OOM) and produced the
# TS2742 "cannot be named" error. Every package we typecheck against is in
# devDependencies; the rest are runtime-provided.
autoInstallPeers: false

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  cpu-features: false
  koffi: false
  node-pty: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.5-alpha.2'
  - '@deepseek-ai/cordis-plugin-include@1.0.10-alpha.2'
  - '@deepseek-ai/cordis-plugin-loader@1.0.6-alpha.2'
  - '@deepseek-ai/dsh-agent-preset-registry@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-agent@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-api-remotes@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-app-boot@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-atomic-write@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-bash-local@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-brand@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-client-locale@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-client-ui-renderer@0.2.1-alpha.4'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.1-alpha.4'
