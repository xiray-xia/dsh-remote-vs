packages:
  - .

# Peer auto-install must stay ON. The host half keeps its dependencies external,
# so at runtime Node resolves `@deepseek-ai/dsh-subprocess` and friends from THIS
# tree — and those packages peer-depend on further packages (dsh-subprocess ->
# @deepseek-ai/dsh-http-proxy) that only this tree can provide; the app's copy is
# not reachable from here. Turning it off made every plugin entry fail to import
# with ERR_MODULE_NOT_FOUND (2026-10-16).
# The old-generation pollution it used to cause is fixed at the source instead:
# peer ranges are narrowed to the alpha.4 line and the unused dsh-better-sidebar
# peer is gone, so auto-install stays within one generation (see §2.21).
autoInstallPeers: true

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': false
  cpu-features: false
  koffi: false
  node-pty: false
  ssh2: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis-plugin-group@1.0.5'
  - '@deepseek-ai/cordis-plugin-include@1.0.10'
  - '@deepseek-ai/cordis-plugin-loader@1.0.6'
  - '@deepseek-ai/dsh-agent-preset-registry@0.2.1-rc.2'
  - '@deepseek-ai/dsh-agent@0.2.1-rc.2'
